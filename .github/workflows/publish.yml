name: Publish gate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 同 ci.yml：模块导入审计需要真实 node_modules（workspace 包 + js-yaml 等）。
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 发布门禁的第一条：tag 必须等于 package.json 的版本，否则会发出"标签写 v0.7.4、
      # 包内却是 0.7.3"的版本 —— 用户更新检查永远对不上。以前完全没校验这一条。
      - name: tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "只接受 v* tag（当前：$tag）"; exit 1 ;;
          esac
          node scripts/version.mjs check
          ver=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$ver" ]; then
            echo "tag $tag ≠ package.json v$ver"
            exit 1
          fi
          echo "OK: $tag"

      - name: 语法检查
        run: |
          set -o pipefail
          node --check lib/index.js
          node --check widget/lib/index.js
          node --check backend/lib/index.js
          node --check shims/qq-mode/lib/qq-mode.js
          git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check

      - name: 构建产物与源一致
        run: node build.mjs --check

      - name: 版本一致性
        run: node scripts/version.mjs check

      - name: 隐私与敏感信息扫描
        run: node scripts/privacy-scan.mjs --strict

      # 隐私第二道防线（第一道是 package.json 的 prepublishOnly → scripts/publish-guard.mjs）：
      # 本机人设是**构建期生成物**（presets/*.patch.yml、dsh/agent-presets/persona.system.md），
      # 不进 git 但会被 npm pack 按 files 白名单从磁盘取走。CI 是干净 clone ⇒ 本就不该存在；
      # 真出现了说明有人改了打包方式或把生成物提交进了仓库 —— 必须拦在发布前。
      - name: 发布物不得含本机人设生成物
        run: |
          node scripts/publish-guard.mjs
          if git ls-files | grep -qE '^(presets/.*\.patch\.yml|dsh/agent-presets/persona\.system\.md)$'; then
            echo "ERROR: 人设生成物被提交进了 git（应从版本库移除，仅本地生成）"; exit 1
          fi

      - name: 开发机路径扫描
        run: |
          if grep -rn "TestBox" lib backend/lib widget/lib src scripts; then
            echo "发现开发机路径 TestBox，请先清理"; exit 1
          fi

      - name: 图层审计
        run: node widget/tools/z-layer-audit.mjs

      - name: 挂件行为回归（泡泡配置语义 / 并列候选 / 死设置 / 表情包冒烟）
        run: |
          node widget/tools/bubble-config-audit.mjs
          node widget/tools/choice-options-audit.mjs
          node widget/tools/check-dead-settings.mjs
          node widget/tools/expr-smoke.mjs

      - name: 配置模糊与守卫边界审计
        run: |
          node widget/tools/config-fuzz-audit.mjs
          node widget/tools/token-guard-audit.mjs
          node widget/tools/persona-layers-audit.mjs
          node widget/tools/module-import-audit.mjs

      - name: 出站安全审计
        run: node widget/tools/outbound-safety-audit.mjs

      - name: 核心不变量审计
        run: node widget/tools/ci-audit.mjs --no-pack

      - name: 审计脚本自检
        run: node widget/tools/ci-audit-selftest.mjs
